[project]
name = "elvideo"
version = "0.1.0"
description = "Path B (Gemini-native) shot-level video understanding index -> footage_index.json"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "google-genai>=2.14.0",
    "jsonschema>=4.26.0",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "scenedetect>=0.7.1",
    "tenacity>=9.1.4",
    "typer>=0.27.0",
    "whisperx>=3.8.6",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# .agents/ is vendored tooling, not this project's source.
extend-exclude = [".agents", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option/Argument in a default IS the Typer API — the object is the parameter spec, not a
# shared mutable default. B008 already ignores them when the parameter is annotated with a known
# immutable type (str, float), so it fires only on the enum-annotated ones, which is arbitrary.
# Listing them keeps B008 live for real mutable defaults elsewhere.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
# 3.12, not the 3.11 floor: numpy 2.5's bundled stubs use PEP 695 `type` statements, which mypy
# refuses to parse below 3.12 — a hard failure, not suppressible per-module. Runtime support for
# 3.11 is unaffected. `ruff.target-version = "py311"` still guards the floor. See decisions-log
# D-011.
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

# Third-party libs below ship no type stubs; don't fail the build on that.
[[tool.mypy.overrides]]
module = ["cv2.*", "scenedetect.*", "whisperx.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: real-model integration runs (minutes on CPU); deselect with -m 'not slow'",
]
# The project is not installed as a package; make `import elvideo` resolve from the repo root.
pythonpath = ["."]
